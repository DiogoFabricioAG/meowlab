# Portal app.meowlab.tech en el VPS (ADR-0006). Vive en /opt/meowlab-app/deploy.
# Redes externas existentes: manolo_ingress (Caddy y bridge) y manolo_internal (PostgreSQL).
# Los secretos son archivos en ./secrets (fuera de git, permisos 600).
name: meowlab-app

services:
  app:
    image: meowlab-app:${MEOWLAB_APP_TAG:?definir MEOWLAB_APP_TAG con el commit}
    container_name: meowlab-app
    restart: unless-stopped
    environment:
      BETTER_AUTH_URL: https://app.meowlab.tech
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      DATABASE_HOST: postgres
      DATABASE_NAME: meowlab_app
      DATABASE_USER: meowlab_app
      DATABASE_PASSWORD_FILE: /run/secrets/meowlab_app_db_password
      # Bridge por la red interna; la firma HMAC protege igual que por Caddy.
      BRIDGE_URL: http://manolo-bridge:3000
      PORTAL_BRIDGE_HMAC_SECRET_FILE: /run/secrets/portal_bridge_hmac_secret
      # Opcionales: sin ellos el portal funciona sólo con correo y contraseña.
      GOOGLE_CLIENT_ID_FILE: /run/secrets/google_client_id
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
    secrets:
      - better_auth_secret
      - meowlab_app_db_password
      - portal_bridge_hmac_secret
      - google_client_id
      - google_client_secret
    networks:
      - manolo_ingress
      - manolo_internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  better_auth_secret:
    file: ./secrets/better_auth_secret
  meowlab_app_db_password:
    file: ./secrets/meowlab_app_db_password
  portal_bridge_hmac_secret:
    file: ./secrets/portal_bridge_hmac_secret
  google_client_id:
    file: ./secrets/google_client_id
  google_client_secret:
    file: ./secrets/google_client_secret

networks:
  manolo_ingress:
    external: true
  manolo_internal:
    external: true
