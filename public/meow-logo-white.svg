<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <!-- White Cat Figure (Speaking / Meowing directly towards the text) -->
  <g transform="translate(6, 6)">
    <!-- White Cat Ears -->
    <polygon points="12,26 18,6 28,18" fill="#ffffff" />
    <polygon points="38,26 48,6 38,18" fill="#ffffff" />
    <!-- Subtle depth -->
    <polygon points="15,24 19,10 25,18" fill="#0a0929" />
    <polygon points="38,24 44,10 38,18" fill="#0a0929" />

    <!-- Cat Head Contour in White -->
    <path d="M12,22 C12,16 38,16 42,22 C50,26 52,36 48,43 C44,48 36,52 26,52 C15,52 10,46 10,34 Z" fill="#ffffff" />
    <path d="M14,24 C14,18 36,18 40,24 C46,28 47,37 43,42 C40,46 33,49 26,49 C17,49 13,44 13,34 Z" fill="#12103f" />

    <!-- Neon Cyber Eyes -->
    <polygon points="20,30 26,32 20,34" fill="#c1ff72" />
    <polygon points="33,32 39,30 39,34" fill="#c1ff72" />

    <!-- White Whiskers pointing towards muzzle -->
    <line x1="6" y1="36" x2="16" y2="38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="6" y1="41" x2="16" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Open Mouth pointing right to the text uttering 'meow' -->
    <path d="M40,38 Q48,42 51,39 Q47,46 38,45" fill="#c1ff72" />
    
    <!-- Neon Voice Beam Waves from the mouth straight into the word 'meow' -->
    <path d="M54,34 Q58,39 54,44" stroke="#c1ff72" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M59,31 Q65,39 59,47" stroke="#c1ff72" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M64,28 Q72,39 64,50" stroke="#c1ff72" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.45" />
  </g>

  <!-- Word: meow in Green (#c1ff72) and lab in White (#ffffff) aligned with cat's mouth -->
  <g transform="translate(84, 46)">
    <text font-family="'Blinker', sans-serif" font-size="36" font-weight="900" letter-spacing="-0.8">
      <tspan fill="#c1ff72">meow</tspan><tspan fill="#ffffff">lab</tspan>
    </text>
    <!-- AI badge -->
    <rect x="182" y="-25" width="34" height="19" rx="4" fill="#c1ff72" fill-opacity="0.15" stroke="#c1ff72" stroke-width="1.2"/>
    <text x="190" y="-11.5" font-family="'Blinker', sans-serif" font-size="11" font-weight="800" fill="#c1ff72">.AI</text>
  </g>
</svg>
